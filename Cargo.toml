[package]
name = "rusty-lcu"
version = "0.1.1"
edition = "2024"
description = "Rust client helpers for the League Client Update and Live Client Data APIs"
license = "MIT"
repository = "https://github.com/steele123/rusty-lcu"
homepage = "https://github.com/steele123/rusty-lcu"
documentation = "https://docs.rs/rusty-lcu"
readme = "README.md"
keywords = ["league-client", "lcu", "riot", "league-of-legends"]
categories = ["api-bindings", "asynchronous", "games"]
rust-version = "1.88"
exclude = [".idea/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["lcu", "live-client", "websocket"]
lcu = ["dep:sysinfo", "dep:urlencoding", "tokio/fs", "tokio/process"]
live-client = ["dep:tokio-util"]
websocket = [
    "lcu",
    "dep:base64",
    "dep:futures-util",
    "dep:http",
    "dep:native-tls",
    "dep:tokio-tungstenite",
    "tokio/net",
]

[dependencies]
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
native-tls = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38.4", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = "2"
urlencoding = { version = "2", optional = true }

[build-dependencies]
heck = "0.5"
serde_json = "1"

[[example]]
name = "current_summoner"
required-features = ["lcu"]

[[example]]
name = "list_endpoints"
required-features = ["lcu"]

[[example]]
name = "live_game_data"
required-features = ["live-client"]
